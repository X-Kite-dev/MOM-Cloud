spring:
  data:
    redis:
      host: service.example.invalid
      port: 6379
      password: ${MOM_REDIS_PASSWORD}
      database: 14
  # 动态多数据源配置
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          username: ${MYSQL_USER}
          password: ${MYSQL_PASSWORD}
          url: jdbc:postgresql://service.example.invalid/${MOM_PG_DATABASE:kitex_mom}?currentSchema=kitex
          druid:
            initial-size: 5
            min-idle: 5
            max-active: 20
            max-wait: 60000
            validation-query: SELECT 1
            test-on-borrow: false
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
        mdm:
          driver-class-name: org.postgresql.Driver
          username: ${MYSQL_USER}
          password: ${MYSQL_PASSWORD}
          url: jdbc:postgresql://service.example.invalid/${MOM_PG_DATABASE:kitex_mom}?currentSchema=mom_mdm
          druid:
            initial-size: 3
            min-idle: 3
            max-active: 15
            max-wait: 60000
            validation-query: SELECT 1
            test-on-borrow: false
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
        mes:
          driver-class-name: org.postgresql.Driver
          username: ${MYSQL_USER}
          password: ${MYSQL_PASSWORD}
