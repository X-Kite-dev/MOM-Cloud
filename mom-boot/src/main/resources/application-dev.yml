        iot:
          url: jdbc:mysql://service.example.invalid/mom-iot?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
          username: REDACTED_ACCOUNT
          password: ${MOM_IOT_DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          druid:
            initial-size: 3
            min-idle: 3
            max-active: 15
            max-wait: 60000
            validation-query: SELECT 1
            test-on-borrow: false
            test-while-idle: true
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
      druid:
        stat-view-servlet:
          enabled: true
          url-pattern: /druid/*
          login-username: REDACTED_ACCOUNT
          login-password: ${MOM_DRUID_PASSWORD}
        web-stat-filter:
          enabled: true
          url-pattern: /*
          exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"


# 文件上传配置
file:
  local:
    enable: true
    base-path: ${MOM_FILE_UPLOAD_BASE_PATH:/tmp/mom-uploads}

# 验证码配置
aj:
  captcha:
    water-mark: mom-cloud

# 登录报文加密根密钥 ，必须是16位
security:
  encodeKey: ${MOM_SECURITY_ENCODE_KEY}
  oauth2:
    client:
      client-id: 'mom-boot'
      client-secret: ${MOM_BOOT_OAUTH_CLIENT_SECRET}

# 配置文件加密根密码
jasypt:
  encryptor:
    password: ${MOM_JASYPT_PASSWORD}

# swagger token url 配置
swagger:
  token-url: service.example.invalid

# Logger Config
logging:
  level:
    com.kitex.**: debug
