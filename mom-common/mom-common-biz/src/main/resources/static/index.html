<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <link href="${templateUrl}/css/print-lock.css" media="print" rel="stylesheet" type="text/css">
    <link href="${templateUrl}/css/hiprint.css">
    <script src="${templateUrl}/js/jquery.js"></script>
    <script src="${templateUrl}/js/JsBarcode.all.min.js"></script>
    <script src="${templateUrl}/js/bwip-js.js"></script>
    <script src="${templateUrl}/js/nzh.min.js"></script>
    <script src="${templateUrl}/js/jquery.minicolors.min.js"></script>
    <script src="${templateUrl}/js/socket.io.min.js"></script>
    <script src="${templateUrl}/js/umd.js"></script>
    <script src="${templateUrl}/js/jspdf.umd.min.js"></script>
    <script src="${templateUrl}/js/html2canvas.js"></script>
    <script src="${templateUrl}/js/vue-plugin-hiprint.js"></script>
    <script src="https://unpkg.com/vue-plugin-hiprint@0.0.57-beta31/dist/vue-plugin-hiprint.js"></script>
</head>

<body>
<div class="container"></div>
<script>
    // console.log(window['vue-plugin-hiprint'])
    // hiprint 以注入 全局
    // console.log(hiprint)

    var autoConnect = window['vue-plugin-hiprint'].autoConnect,
        disAutoConnect = window['vue-plugin-hiprint'].disAutoConnect,
        defaultElementTypeProvider = window['vue-plugin-hiprint'].defaultElementTypeProvider;

    disAutoConnect(); // 取消自动连接
    hiprint.init({
        providers: [defaultElementTypeProvider()],
    });

    let hiprintTemplate = new hiprint.PrintTemplate({template: $
    {
        template
    }
    })
    ;
    const getHtml = () => {
        let html = hiprintTemplate.getHtml($
        {
            printData
        }
    )
        ;
        do {
            setTimeout(() => {
                $(".container").empty();
                $(".container").html(html);
            }, 200);
            return;
        } while ($(".container").length <= 0);
    };
    getHtml()
</script>
</body>

</html>
