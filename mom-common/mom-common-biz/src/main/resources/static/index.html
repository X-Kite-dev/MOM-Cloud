<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="${templateUrl}/css/print-lock.css" media="print" rel="stylesheet" type="text/css">
    <link href="${templateUrl}/css/hiprint.css" rel="stylesheet" type="text/css">
    <script>
        // HiPrint reads localStorage at module load; opaque-origin previews need only an in-memory substitute.
        try {
            void window.localStorage;
        } catch {
            const values = new Map();
            Object.defineProperty(window, 'localStorage', {
                configurable: true,
                value: {
                    get length() { return values.size; },
                    getItem(key) { return values.has(String(key)) ? values.get(String(key)) : null; },
                    setItem(key, value) { values.set(String(key), String(value)); },
                    removeItem(key) { values.delete(String(key)); },
                    clear() { values.clear(); },
                    key(index) { return Array.from(values.keys())[index] ?? null; }
                }
            });
        }
    </script>
    <script src="${templateUrl}/js/jquery.js"></script>
    <script src="${templateUrl}/js/JsBarcode.all.min.js"></script>
    <script src="${templateUrl}/js/bwip-js.js"></script>
    <script>
        // The shipped renderer exports bwipjs; HiPrint's external module expects bwip-js.
        // Keep an instance already registered by a compatible plugin.
        if (!window['bwip-js'] && window.bwipjs) {
            window['bwip-js'] = window.bwipjs;
        }
    </script>
    <script src="${templateUrl}/js/nzh.min.js"></script>
    <script src="${templateUrl}/js/jquery.minicolors.min.js"></script>
    <script src="${templateUrl}/js/socket.io.min.js"></script>
    <script src="${templateUrl}/js/umd.js"></script>
    <script src="${templateUrl}/js/jspdf.umd.min.js"></script>
    <script src="${templateUrl}/js/html2canvas.js"></script>
    <script src="${templateUrl}/js/vue-plugin-hiprint.js"></script>
</head>
<body>
<div class="container"></div>
<script>
    (() => {
        const documentId = window.crypto?.randomUUID?.() || String(Date.now()) + '-' + String(Math.random());
        let ready = false;
        const notify = (type, message) => window.parent.postMessage({ type, documentId, message }, '*');
        const fail = (error) => {
            ready = false;
            notify('MOM_PRINT_ERROR', error?.message || '打印内容渲染失败，请重新预览');
        };
        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || !ready || event.data?.type !== 'MOM_PRINT_REQUEST' || event.data.documentId !== documentId) return;
            try {
                window.print();
            } catch (error) {
                fail(error);
            }
        });
        const render = async () => {
            const plugin = window['vue-plugin-hiprint'];
            plugin.disAutoConnect();
            hiprint.init({ providers: [plugin.defaultElementTypeProvider()] });
            const layout = JSON.parse(${templateJson});
            const data = JSON.parse(${printDataJson});
            const template = new hiprint.PrintTemplate({ template: layout });
            const html = template.getHtml(data);
            if (!html || (!html.length && !html.nodeType)) throw new Error('打印布局没有生成有效内容');
            $('.container').empty().html(html);
            if (document.fonts?.ready) await document.fonts.ready;
            await Promise.all(Array.from(document.images).map((image) => {
                if (typeof image.decode === 'function') return image.decode();
                if (image.complete) {
                    if (image.naturalWidth > 0) return Promise.resolve();
                    return Promise.reject(new Error('打印图片未加载完成'));
                }
                return new Promise((resolve, reject) => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', () => reject(new Error('打印图片加载失败')), { once: true });
                });
            }));
            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            ready = true;
            notify('MOM_PRINT_READY');
        };
        render().catch(fail);
    })();
</script>
</body>
</html>
