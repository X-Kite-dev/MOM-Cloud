# Nacos loader DEBUG includes the complete remote configuration content.
logging:
  level:
    com.alibaba.cloud.nacos.configdata.NacosConfigDataLoader: INFO

mom:
  bootstrap:
    nacos:
      required: true

server:
  port: 33000

spring:
  application:
    name: kitex-mom-pms
  cloud:
    nacos:
      username: ${MOM_NACOS_USERNAME}
      password: ${MOM_NACOS_PASSWORD}
      discovery:
        group: ${MOM_NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${MOM_NACOS_SERVER_ADDR}
        namespace: ${MOM_NACOS_NAMESPACE}
      config:
        group: ${MOM_NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${MOM_NACOS_NAMESPACE}
  config:
    import:
      - nacos:application-${MOM_CONFIG_PROFILE}.yml
      - nacos:${spring.application.name}-${MOM_CONFIG_PROFILE}.yml

